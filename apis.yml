aid: m-0
name: M 0
description: >-
  M0 (M0 Foundation) is modular stablecoin infrastructure that lets organizations
  launch and operate a custom, brand-owned stablecoin across EVM chains and Solana.
  Its platform splits into configurable application, distribution, and issuance
  layers, and exposes two developer APIs: the Orchestration REST API for quoting and
  executing cross-chain stablecoin conversions between M0 extensions and stablecoins
  like USDC and USDT, and the Protocol GraphQL API for querying on-chain supply,
  holder balances, yields, and configuration. Backed by Earlybird and other crypto
  investors; used by MetaMask, PayPal, and MoonPay.
